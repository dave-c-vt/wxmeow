[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 6.0

# Add options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=wxmeow
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

# Markers for organizing tests
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    functional: Functional tests that test complete user workflows
    slow: Tests that take more than 5 seconds to run
    external: Tests that require external services or APIs
    chart: Tests related to weather chart functionality
    api: Tests for API endpoints
    web: Tests for web interface functionality

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:urllib3.*

# Test timeout (in seconds)
timeout = 300

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable cacheprovider for consistent test runs
cache_dir = .pytest_cache
