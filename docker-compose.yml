version: "3.8"

services:
  wxmeow:
    build: .
    container_name: ${CONTAINER_NAME:-wxmeow-app}
    ports:
      - "${EXTERNAL_PORT:-8000}:${INTERNAL_PORT:-5000}"
    environment:
      - FLASK_APP=${FLASK_APP:-wxmeow}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DEBUG=${DEBUG:-false}
      - PICKLE_DIR=${PICKLE_DIR:-/app/.pkl}
      - PICKLE_MAX_AGE=${PICKLE_MAX_AGE:-600}
      - PICKLE_AUTO_CLEANUP=${PICKLE_AUTO_CLEANUP:-true}
      - WEATHER_API_TIMEOUT=${WEATHER_API_TIMEOUT:-30}
      - WEATHER_API_MAX_RETRIES=${WEATHER_API_MAX_RETRIES:-3}
      - DEFAULT_LOCATION=${DEFAULT_LOCATION:-Boston, MA}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=${LOG_FILE:-/app/logs/wxmeow.log}
      - LOG_REQUESTS=${LOG_REQUESTS:-false}
      - CHART_DAYS=${CHART_DAYS:-7}
      - CHART_REFRESH_INTERVAL=${CHART_REFRESH_INTERVAL:-300}
      - CHART_ANIMATIONS=${CHART_ANIMATIONS:-true}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-60}
      - CSRF_ENABLED=${CSRF_ENABLED:-true}
      - CACHING_ENABLED=${CACHING_ENABLED:-true}
      - CACHE_TIMEOUT=${CACHE_TIMEOUT:-300}
      - HEALTH_CHECK_PATH=${HEALTH_CHECK_PATH:-/health}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-30}
      - AUTO_RELOAD=${AUTO_RELOAD:-false}
      - SHOW_ERROR_DETAILS=${SHOW_ERROR_DETAILS:-false}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-false}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backups}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Persistent storage for weather data (pickle files)
      - wxmeow_data:/app/.pkl
      # Persistent storage for logs
      - wxmeow_logs:/app/logs
      # Persistent storage for backups (if enabled)
      - wxmeow_backups:/app/backups
      # Optional: bind mount for development
      # - .:/app/dev:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${INTERNAL_PORT:-5000}${HEALTH_CHECK_PATH:-/health}')",
        ]
      interval: ${HEALTH_CHECK_INTERVAL:-30}s
      timeout: 10s
      retries: 3
      start_period: 40s
    # networks:
    #   - wxmeow-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_NAME:-wxmeow-app}-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./ssl:/etc/nginx/ssl:ro
      # Let's Encrypt certificates
      - letsencrypt_certs:/etc/letsencrypt:ro
    depends_on:
      - wxmeow
    restart: unless-stopped
    # networks:
    #   - wxmeow-network
    profiles:
      - production
      - nginx

  # Optional: Monitoring with simple health checks
  healthcheck:
    image: alpine:latest
    container_name: ${CONTAINER_NAME:-wxmeow-app}-monitor
    environment:
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-30}
      - INTERNAL_PORT=${INTERNAL_PORT:-5000}
      - HEALTH_CHECK_PATH=${HEALTH_CHECK_PATH:-/health}
    command: >
      sh -c '
        while true; do
          sleep $${HEALTH_CHECK_INTERVAL:-30};
          wget -q --spider http://wxmeow:$${INTERNAL_PORT:-5000}$${HEALTH_CHECK_PATH:-/health} ||
          echo "$$(date): wxmeow health check failed" >> /var/log/wxmeow-monitor.log;
        done
      '
    volumes:
      - wxmeow_logs:/var/log
    depends_on:
      - wxmeow
    restart: unless-stopped
    # networks:
    #   - wxmeow-network
    profiles:
      - monitoring

  # Optional: Log aggregation
  logrotate:
    image: alpine:latest
    container_name: ${CONTAINER_NAME:-wxmeow-app}-logrotate
    command: >
      sh -c "
        apk add --no-cache logrotate &&
        echo '/var/log/wxmeow/*.log {
          daily
          missingok
          rotate ${LOG_RETENTION_DAYS:-30}
          compress
          delaycompress
          notifempty
          copytruncate
        }' > /etc/logrotate.d/wxmeow &&
        while true; do
          logrotate /etc/logrotate.d/wxmeow;
          sleep 24h;
        done
      "
    volumes:
      - wxmeow_logs:/var/log/wxmeow
    restart: unless-stopped
    profiles:
      - logging

volumes:
  wxmeow_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_DATA_DIR:-./data/.pkl}
  wxmeow_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_LOGS_DIR:-./logs}
  wxmeow_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_BACKUP_DIR:-./backups}
  letsencrypt_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SSL_CERT_DIR:-./ssl/letsencrypt}
