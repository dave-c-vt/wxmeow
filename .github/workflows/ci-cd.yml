name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        test-type: [unit, integration, functional]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Lint with flake8
        if: matrix.test-type == 'unit'
        run: |
          flake8 wxmeow --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 wxmeow --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        if: matrix.test-type == 'unit'
        run: black --check --diff wxmeow/

      - name: Import sort check with isort
        if: matrix.test-type == 'unit'
        run: isort --check-only --diff wxmeow/

      - name: Type check with mypy
        if: matrix.test-type == 'unit'
        run: mypy wxmeow/ --ignore-missing-imports

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: |
          pytest tests/unit/ -v -m "unit" --cov=wxmeow --cov-report=xml --junitxml=test-results-unit.xml

      - name: Start Flask app for integration tests
        if: matrix.test-type == 'integration'
        run: |
          export FLASK_APP=wxmeow
          export FLASK_ENV=testing
          nohup flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 10
          curl -f http://localhost:5000/ || (cat flask.log && exit 1)

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          pytest tests/integration/ -v -m "integration" --cov=wxmeow --cov-report=xml --junitxml=test-results-integration.xml

      - name: Setup Chrome for functional tests
        if: matrix.test-type == 'functional'
        uses: browser-actions/setup-chrome@latest

      - name: Start Flask app for functional tests
        if: matrix.test-type == 'functional'
        run: |
          export FLASK_APP=wxmeow
          export FLASK_ENV=testing
          nohup flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          sleep 10
          curl -f http://localhost:5000/ || (cat flask.log && exit 1)

      - name: Run functional tests
        if: matrix.test-type == 'functional'
        run: |
          pytest tests/functional/ -v -m "functional" --cov=wxmeow --cov-report=xml --junitxml=test-results-functional.xml
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.test-type }}
          path: |
            test-results-*.xml
            coverage.xml
            htmlcov/
            flask.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.test-type == 'unit' && matrix.python-version == env.PYTHON_VERSION
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"

      - name: Run safety check
        run: safety check

      - name: Run bandit security scan
        run: bandit -r wxmeow/ -f json -o bandit-report.json || true

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results
          path: bandit-report.json

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Linux VM
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e

            # Create application directory if it doesn't exist
            sudo mkdir -p /opt/wxmeow
            sudo chown ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /opt/wxmeow
            cd /opt/wxmeow

            # Clone or update repository
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            # Log in to container registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop existing container if running
            docker-compose down || true

            # Start new container
            docker-compose up -d

            # Wait for health check
            sleep 30

            # Verify deployment
            curl -f http://localhost:8000/ || exit 1

            echo "Deployment completed successfully!"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.DEPLOY_HOST }}:8000/ || exit 1

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful to production environment"
          # Add notification logic here (Slack, email, etc.)

      - name: Notify failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          # Add notification logic here (Slack, email, etc.)
